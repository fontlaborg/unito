[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "unito-font"
dynamic = ["version"]
description = "Unito font builder - merges hundreds of Noto fonts plus Unifont into comprehensive pan-Unicode TTFs"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "OFL-1.1"}
authors = [
    {name = "Unito Contributors"},
]
keywords = ["font", "unicode", "noto", "merge", "glyph"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Text Processing :: Fonts",
]

dependencies = [
    "fonttools>=4.40.0",
    "fontmake>=3.9.0",
    "drawbot-skia>=0.5.0",
    "bumpfontversion>=0.4.1",
    "diskcache>=5.6.0",
    "fire>=0.5.0",
    "unicodedata2>=17.0.0",
    "pyyaml>=6.0.0",
    "requests>=2.31.0",
    "afdko>=4.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[project.scripts]
unito-build = "unito.cli:main"

[project.urls]
Homepage = "https://github.com/fontlaborg/unito-font"
Repository = "https://github.com/fontlaborg/unito-font"
Issues = "https://github.com/fontlaborg/unito-font/issues"

# Version is derived from git tags (vX.Y.Z) via hatch-vcs; no hand-edited
# version string to keep in sync across pyproject and the package.
[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/unito"]

[tool.hatch.build.targets.sdist]
include = ["src/unito", "README.md", "OFL.txt"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
